<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pesawat Pintar - Sistem Pernapasan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ====== DASAR ====== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0a2347;overflow:hidden;touch-action:none;overscroll-behavior:none;
  font-family:'Baloo 2','Fredoka','Trebuchet MS',Verdana,sans-serif;font-weight:700}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#7cc8f5}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.bgimg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.screen.noimg{background:linear-gradient(#3f9fe8 0%,#8fd3f7 55%,#d7f1ff 100%)}
.screen.noimg::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 160px 60px at 12% 18%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 220px 70px at 78% 12%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 260px 80px at 55% 92%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 200px 60px at 8% 85%,#fff 60%,transparent 62%)}
.fb{display:none}
.noimg .fb{display:block}

/* credit */
#credit{position:absolute;left:24px;bottom:14px;z-index:60;background:#1f5fbf;color:#fff;font-size:15px;font-weight:700;
  padding:3px 14px;border-radius:16px;border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none;letter-spacing:.2px}

/* ====== HOTSPOT / TOMBOL DI ATAS GAMBAR ====== */
.hot{position:absolute;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;border-radius:26px;padding:0;
  transition:transform .12s,box-shadow .12s;font-family:inherit;font-weight:800}
.hot:active{transform:scale(.96)}
.hasimg .hot:hover{box-shadow:0 0 0 4px rgba(255,255,255,.65)}
.hasimg .hot.sel{box-shadow:0 0 0 5px #ffe14d,0 0 26px 10px rgba(255,235,90,.85)}
.noimg .hot{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;color:#fff;font-size:30px;
  border:4px solid #fff;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 6px 0 rgba(0,0,0,.22)}
.noimg .hot.sel{outline:6px solid #ffe14d;filter:brightness(1.12)}

.hstart{left:44%;top:68.5%;width:32.5%;height:20.5%}
.hm1{left:30.8%;top:36.5%;width:12.8%;height:15%}
.hm2{left:46.3%;top:36.5%;width:13%;height:15%}
.hm3{left:61.9%;top:36.5%;width:13%;height:15%}
.hl1{left:30.4%;top:61%;width:12.9%;height:10.4%}
.hl2{left:45.5%;top:61%;width:13.6%;height:10.4%}
.hl3{left:61.2%;top:61%;width:14%;height:10.4%}
.hgo{left:30.5%;top:76%;width:45.5%;height:14.5%}
.hcam{left:79.5%;top:35.5%;width:18%;height:21.5%}
.htouch{left:79.5%;top:59.5%;width:18%;height:13%}
.noimg .hstart,.noimg .hgo{background:linear-gradient(#ffb12a,#ff7a00);border-color:#ffd45c;border-radius:60px;font-size:54px}
.noimg .hgo{font-size:38px}
.noimg .hm1,.noimg .hl1{background:linear-gradient(#3b8bff,#1e56d6)}
.noimg .hm2{background:linear-gradient(#55d24a,#2c9a2a)}
.noimg .hm3{background:linear-gradient(#a05cff,#6a2fd0)}
.noimg .hl1{background:linear-gradient(#58d34a,#2c9a2a)}
.noimg .hl2{background:linear-gradient(#ffb12a,#ff7a00)}
.noimg .hl3{background:linear-gradient(#a05cff,#6a2fd0);font-size:24px}
.noimg .hm1,.noimg .hm2,.noimg .hm3,.noimg .hl1,.noimg .hl2{font-size:26px}
.noimg .hcam,.noimg .htouch{background:rgba(255,255,255,.9);color:#1b4fb8;font-size:18px;text-shadow:none;border-color:#7cc0ff;padding:6px}

.fbTitle{position:absolute;left:30%;top:2%;width:70%;text-align:center;font-size:86px;line-height:.95;color:#ffd21f;
  -webkit-text-stroke:10px #1b4fb8;paint-order:stroke fill;text-shadow:0 8px 0 #0e3a8f}
.fbTitle .w{display:block;color:#fff}
.fbMenuTitle{left:42%;top:14%;width:55%;font-size:110px}
.fbBoy{position:absolute;left:3%;top:22%;font-size:300px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.fbLung{position:absolute;right:4%;bottom:6%;font-size:120px}
.fbHead{position:absolute;text-align:center;font-size:30px;color:#fff;background:linear-gradient(#2f7bf0,#1a4fc0);border:4px solid #bfe4ff;border-radius:22px;padding:2px 0}
.fbHead b{color:#ffe14d}
.fbHead.a{left:36%;top:28%;width:28%}
.fbHead.b{left:36%;top:53%;width:28%}
.fbHead.c{left:79%;top:29%;width:19%;font-size:22px}

.sbtn{position:absolute;z-index:70;width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(20,70,170,.65);
  color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.sbtn:active{transform:scale(.92)}

/* ====== KARTU / PANEL UMUM ====== */
.pscreen{background:linear-gradient(#3f9fe8 0%,#8fd3f7 60%,#d7f1ff 100%)}
.pscreen::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 200px 64px at 10% 20%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 260px 80px at 85% 14%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 300px 90px at 70% 95%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 240px 70px at 12% 92%,#fff 60%,transparent 62%)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:640px;max-width:1100px;max-height:660px;overflow:hidden;
  background:linear-gradient(#f7fbff,#dcecff);border:8px solid #1f6fe0;border-radius:40px;box-shadow:0 0 0 6px #fff,0 14px 30px rgba(0,40,110,.4);
  padding:22px 36px 26px;text-align:center;color:#12388f}
.card h1{margin:0 0 6px;font-size:56px;line-height:1.05;color:#ffd21f;-webkit-text-stroke:8px #1b4fb8;paint-order:stroke fill;text-shadow:0 6px 0 #0e3a8f}
.card h2{margin:4px 0;font-size:34px;color:#12388f}
.card p{margin:6px 0;font-size:26px}
.bigbtn{font-family:inherit;font-weight:800;font-size:36px;color:#fff;padding:6px 44px 10px;border-radius:60px;border:6px solid #ffd45c;cursor:pointer;
  background:linear-gradient(#ffb12a,#ff7a00);text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:0 7px 0 #b9500a,0 10px 14px rgba(0,0,0,.3);margin:10px 8px 6px}
.bigbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #b9500a}
.bigbtn.alt{background:linear-gradient(#4a97ff,#1f5fd6);border-color:#bfe0ff;box-shadow:0 7px 0 #123a91,0 10px 14px rgba(0,0,0,.3)}
.bigbtn.sm{font-size:24px;padding:4px 26px 6px}
.stars{font-size:78px;color:#ffc21a;text-shadow:0 4px 0 #b57a00;letter-spacing:6px;line-height:1}
.stars .off{color:#b9c8dc;text-shadow:none}
table.lb{border-collapse:separate;border-spacing:0 8px;margin:6px auto;font-size:30px;min-width:820px}
table.lb th{color:#fff;background:#1f6fe0;padding:4px 16px;font-size:22px}
table.lb td{background:#fff;padding:6px 16px;border-top:3px solid #9ccaff;border-bottom:3px solid #9ccaff}
table.lb tr.r1 td{background:#fff3b8}
table.lb td:first-child,table.lb th:first-child{border-radius:16px 0 0 16px;border-left:3px solid #9ccaff}
table.lb td:last-child,table.lb th:last-child{border-radius:0 16px 16px 0;border-right:3px solid #9ccaff}
.bigname{font-size:72px;color:#e8322e;line-height:1.05;margin:8px 0}

/* modal nama */
#nameModal{position:absolute;inset:0;z-index:80;background:rgba(5,25,70,.55);display:none}
#nameModal.on{display:block}
#nameInputs input{display:block;margin:10px auto;width:520px;font-family:inherit;font-weight:700;font-size:30px;padding:6px 18px;border-radius:18px;border:4px solid #5aa7ff;color:#12388f;text-align:center;user-select:text;-webkit-user-select:text}

/* ====== GAME HUD ====== */
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.panel{position:absolute;background:linear-gradient(#2f7bf0,#1646b8);border:5px solid #bfe4ff;border-radius:30px;box-shadow:0 0 0 3px #1d5ad0,0 6px 12px rgba(0,40,110,.35);color:#fff;text-align:center}
#hudLives{left:21px;top:21px;width:243px;height:105px;padding-top:6px}
#hudLives .lbl{font-size:22px;line-height:1.1;text-shadow:0 2px 0 #0e3a8f}
#hearts{display:flex;justify-content:center;gap:8px;margin-top:2px}
#hearts svg{width:48px;height:45px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
#hearts svg.hurt{animation:hurt .6s}
@keyframes hurt{0%{transform:scale(1.5) rotate(-15deg)}50%{transform:scale(.8) rotate(12deg)}100%{transform:scale(1)}}
#hudPlayer{left:21px;top:134px;height:36px;padding:0 16px;border-radius:20px;font-size:18px;line-height:28px;border-width:3px}
#hudQ{left:335px;top:40px;width:612px;height:156px;background:linear-gradient(#f9fcff,#dcecff);border:8px solid #1f6fe0;border-radius:40px;box-shadow:0 0 0 4px #bfe4ff,0 8px 14px rgba(0,40,110,.35)}
#qNo{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:linear-gradient(#ffc83a,#ff9d0a);border:4px solid #fff;border-radius:22px;
  padding:0 26px;font-size:30px;line-height:42px;color:#12388f;white-space:nowrap;box-shadow:0 3px 0 #b86d00}
#qBody{position:absolute;left:18px;right:18px;top:14px;bottom:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#qText{color:#12388f;font-size:30px;line-height:1.15;text-align:center;font-weight:800}
#hudTime{right:21px;top:14px;width:222px;height:112px;border-radius:34px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
#hudTime svg{width:84px;height:92px;flex:none}
#hudTime .t1{font-size:24px;line-height:1;text-shadow:0 2px 0 #0e3a8f;text-align:left}
#hudTime .t2{font-size:44px;line-height:1;color:#ffd21f;text-shadow:0 3px 0 #0e3a8f}
#hudTime .t2 small{font-size:24px;color:#fff;margin-left:4px}
#hudTime.warn .t2{color:#ff5a5a;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
#tbtns{position:absolute;right:21px;top:134px;display:flex;gap:8px;z-index:30}
#tbtns .sbtn{position:static}
#joyWrap{position:absolute;left:0;top:360px;width:290px;height:360px;z-index:20;touch-action:none}
#joy{position:absolute;left:30px;top:45px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#4f8bff,#1b3fb0 70%);border:10px solid #ffc21a;box-shadow:0 0 0 5px #e69a00,0 8px 14px rgba(0,0,0,.35),inset 0 0 20px rgba(0,0,40,.5);touch-action:none}
#joy i{position:absolute;width:0;height:0;border:14px solid transparent}
#joy i.u{left:72px;top:6px;border-bottom:22px solid #e8f2ff;border-top:0}
#joy i.d{left:72px;bottom:6px;border-top:22px solid #e8f2ff;border-bottom:0}
#joy i.l{top:72px;left:6px;border-right:22px solid #e8f2ff;border-left:0}
#joy i.r{top:72px;right:6px;border-left:22px solid #e8f2ff;border-right:0}
#knob{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#6fb0ff,#1d63f0 70%);border:4px solid #bfe0ff;box-shadow:0 4px 8px rgba(0,0,0,.4)}
#banner{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:104px;line-height:1.05;color:#ffd21f;-webkit-text-stroke:9px #1b4fb8;paint-order:stroke fill;
  text-shadow:0 8px 0 #0e3a8f;pointer-events:none;opacity:0;z-index:40}
#banner.show{opacity:1;animation:pop .45s}
#banner.good{color:#6dff6d}
#banner.bad{color:#ff7070}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
#expl{position:absolute;left:345px;top:646px;width:600px;min-height:62px;padding:6px 18px;border-radius:24px;background:rgba(255,255,255,.96);border:5px solid #1f6fe0;
  color:#12388f;font-size:20px;line-height:1.15;text-align:center;z-index:35;display:none;box-shadow:0 5px 10px rgba(0,0,0,.3)}
#expl.on{display:block}
#camMini{position:absolute;right:18px;bottom:16px;width:176px;height:132px;border-radius:18px;overflow:hidden;border:4px solid #fff;z-index:25;display:none;background:#123;box-shadow:0 4px 10px rgba(0,0,0,.4);opacity:.85}
#camMini.on{display:block}
#camVideo{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#camMini video,#vbox video{position:static;opacity:1;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#camDot{position:absolute;right:6px;top:6px;width:16px;height:16px;border-radius:50%;background:#ffd21f;border:2px solid #fff}
#camDot.ok{background:#3be05a}
#overlay{position:absolute;inset:0;z-index:50;background:rgba(5,25,70,.6);display:none;align-items:center;justify-content:center}
#overlay.on{display:flex}
.vbox{width:420px;height:315px;margin:8px auto;border-radius:24px;overflow:hidden;border:6px solid #1f6fe0;background:#123;position:relative}
.pbar{width:420px;height:22px;margin:10px auto;border-radius:12px;background:#bcd3f2;border:3px solid #1f6fe0;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(#6dff6d,#22b833);transition:width .1s}
</style>
</head>
<body>
<div id="stage">

  <!-- LAYAR 1: MENU UTAMA (gambar 01_menu_utama.png) -->
  <section id="scr-menu" class="screen" data-img="assets/01_menu_utama.png">
    <div class="fb">
      <div class="fbTitle fbMenuTitle">Sistem<span class="w">Pernapasan</span></div>
      <div class="fbBoy">🧑‍🔬</div><div class="fbLung">🫁</div>
    </div>
    <button class="hot hstart" data-go="setup">Mulai ▶</button>
    <button class="sbtn" id="btnFs" style="right:18px;top:18px;opacity:.55" title="Layar penuh">⛶</button>
  </section>

  <!-- LAYAR 2: PENGATURAN (gambar 02_pengaturan.png) -->
  <section id="scr-setup" class="screen" data-img="assets/02_pengaturan.png">
    <div class="fb">
      <div class="fbTitle" style="left:20%;width:50%;font-size:92px">Pesawat<span class="w">Pintar</span></div>
      <div class="fbBoy" style="font-size:260px;top:30%">🧑‍🔬</div><div class="fbLung">🫁</div>
      <div class="fbHead a">PILIH <b>MODE PEMAIN</b></div>
      <div class="fbHead b">TINGKAT <b>KESULITAN</b></div>
      <div class="fbHead c">FITUR INTERAKTIF</div>
    </div>
    <button class="hot hm1 sel" data-k="players" data-v="1">👦<br>1 Pemain</button>
    <button class="hot hm2" data-k="players" data-v="2">👦👧<br>2 Pemain</button>
    <button class="hot hm3" data-k="players" data-v="3">👦👦👧<br>3 Pemain</button>
    <button class="hot hl1 sel" data-k="level" data-v="mudah">⭐ Mudah</button>
    <button class="hot hl2" data-k="level" data-v="sedang">⭐⭐ Sedang</button>
    <button class="hot hl3" data-k="level" data-v="campuran">🔥 Campuran / HOTS</button>
    <button class="hot hcam" data-k="ctrl" data-v="cam">📷 Sensor Gerak Kamera<br>Jawab dengan melambaikan tangan atau menggerakkan tubuh!</button>
    <button class="hot htouch sel" data-k="ctrl" data-v="touch">👆 Sensor Sentuh Visual<br>Klik langsung pada layar!</button>
    <button class="hot hgo" id="btnGo">Mulai Petualangan Sekarang ▶</button>
    <button class="sbtn" id="btnBack1" style="left:16px;top:16px;opacity:.6" title="Kembali">←</button>
  </section>

  <!-- LAYAR GILIRAN -->
  <section id="scr-trans" class="screen pscreen">
    <div class="card">
      <h2 id="trTop">Giliran Bermain</h2>
      <div class="bigname" id="trName">Pemain 1</div>
      <p id="trInfo"></p>
      <button class="bigbtn" id="btnReady">Siap! ▶</button>

  <!-- LAYAR VERIFIKASI KAMERA -->
  <section id="scr-verify" class="screen pscreen">

      <h2 id="vTitle">Verifikasi Pemain</h2>
      <div class="vbox" id="vbox"></div>
      <div class="pbar"><i id="vbar"></i></div>
      <p id="vMsg">Mengaktifkan kamera...</p>
      <button class="bigbtn alt sm" id="btnSkipCam">Pakai kontrol sentuh saja</button>
    </div>
  </section>

  <!-- LAYAR PERMAINAN -->
  <section id="scr-game" class="screen">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="hudLives" class="panel"><div class="lbl">Sisa Kesempatan:</div><div id="hearts"></div></div>
    <div id="hudPlayer" class="panel"></div>
    <div id="hudQ" class="panel"><div id="qNo">Soal : 1 / 20</div><div id="qBody"><div id="qText"></div></div></div>
    <div id="hudTime" class="panel">
      <svg viewBox="0 0 84 92"><rect x="34" y="2" width="16" height="10" rx="3" fill="#d9332d"/><circle cx="42" cy="52" r="38" fill="#ffb21c" stroke="#fff3c4" stroke-width="5"/><circle cx="42" cy="52" r="29" fill="#fff"/><path d="M42 52V32M42 52l13 8" stroke="#1b2a4a" stroke-width="5" stroke-linecap="round"/><circle cx="42" cy="52" r="4" fill="#1b2a4a"/></svg>

    <div id="tbtns"><button class="sbtn" id="btnMute">🔊</button><button class="sbtn" id="btnPause">⏸</button></div>
    <div id="joyWrap"><div id="joy"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><div id="knob"></div></div></div>
    <div id="banner"></div>
    <div id="expl"></div>
    <div id="camMini"><div id="camDot"></div></div>
    <div id="overlay"><div class="card" id="ovCard"></div></div>

  <!-- LAYAR HASIL -->
  <section id="scr-result" class="screen pscreen">
    <div class="card" id="resCard"></div>
  </section>

  <div id="nameModal"><div class="card" style="min-width:640px">
    <h1 style="font-size:46px">Nama Pemain</h1>
    <div id="nameInputs"></div>
    <button class="bigbtn" id="btnNameOk">Mulai ▶</button>
  </div></div>

  <div id="credit">Created by : Muhammad Raydinor Rahman, S.Pd.</div>
  <video id="camVideo" playsinline muted autoplay></video>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const W=1280,H=720;

/* ================= KONFIGURASI (boleh diubah guru) ================= */
const CFG={
  QN:20,                 // jumlah soal tiap permainan
  LIVES:3,               // jumlah nyawa tiap pemain
  PLANE_SPEED:430,       // kecepatan pesawat (piksel/detik) - normal, tidak lambat
  OBSTACLE_COSTS_LIFE:false, // true = menabrak rintangan mengurangi 1 nyawa
  PX0:90,PX1:1120,PY0:214,PY1:684, // batas gerak pesawat
  BOX_W:430,BOX_H:82,BOX_GAP:6,BOX_TOP:203,
  LV:{ // pengaturan per tingkat soal
    m:{time:30,obs:4,obsSpeed:260,boxSpeed:170,gap:[.8,1.05]},
    s:{time:25,obs:6,obsSpeed:300,boxSpeed:190,gap:[.7,.95]},
    h:{time:30,obs:7,obsSpeed:340,boxSpeed:210,gap:[.65,.9]}
  }
};

/* ================= BANK SOAL (120 soal) =================
 format: [level(m/s/h), topik(o/m/g/p/c), soal, jawaban benar, salah1..salah4, penjelasan]  */
const RAW=[
/* ---------- MUDAH ---------- */
['m','o',"Organ tubuh yang berfungsi untuk pertukaran oksigen dan karbon dioksida adalah ....","Paru-paru","Lambung","Jantung","Ginjal","Hati","Pertukaran oksigen dan karbon dioksida terjadi di alveolus pada paru-paru."],

const AU={ctx:null,mute:false,mus:null,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,d=.15,type='sine',v=.12,delay=0,slide=0){
    if(!this.ctx||this.mute)return;const c=this.ctx,t=c.currentTime+delay;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);},
  noise(d=.8,v=.25){
    if(!this.ctx||this.mute)return;const c=this.ctx,n=(c.sampleRate*d)|0,b=c.createBuffer(1,n,c.sampleRate),dd=b.getChannelData(0);
    for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=v;s.connect(g);g.connect(c.destination);s.start();},
  click(){this.tone(660,.08,'triangle',.1);this.tone(990,.08,'triangle',.08,.06);},
  good(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.2,'triangle',.12,i*.09));},
  bad(){this.tone(240,.4,'sawtooth',.1,0,-140);this.tone(180,.4,'sawtooth',.08,.2,-100);},
  hit(){this.tone(150,.2,'square',.1,0,-70);},
  tick(){this.tone(1100,.05,'square',.04);},
  go(){this.tone(880,.35,'triangle',.12);},
  boom(){this.noise(1.1,.3);this.tone(100,.9,'sawtooth',.15,0,-70);},
  fan(){[523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,.25,'triangle',.12,i*.14));},
  startMusic(){this.stopMusic();const sc=[262,294,330,392,440,523,440,392,330,294];let i=0;
    this.mus=setInterval(()=>{this.tone(sc[i%sc.length],.28,'triangle',.035);if(i%4===0)this.tone(sc[i%sc.length]/2,.5,'sine',.03);i++;},330);},
  stopMusic(){if(this.mus){clearInterval(this.mus);this.mus=null;}}
};

/* ================= KAMERA (MediaPipe Hands) ================= */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';s.onload=res;s.onerror=()=>rej(new Error('gagal memuat '+src));document.head.appendChild(s);});}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function palmCenter(l){let x=0,y=0;[0,5,9,13,17].forEach(i=>{x+=l[i].x;y+=l[i].y;});return{x:x/5,y:y/5};}
function isOpenPalm(l,s){
  const wr=l[0];
  const f=[[8,6],[12,10],[16,14],[20,18]].every(([t,p])=>dist(l[t],wr)>dist(l[p],wr)*1.12);
  const thumb=dist(l[4],l[5])>0.5*s;
  return f&&thumb;
}
const CAM={
  video:$('#camVideo'),hands:null,stream:null,running:false,mode:'off',ok:0,need:9,prev:null,lock:null,
  lastSeen:0,tx:.5,ty:.5,cb:null,onProg:null,busy:false,last:0,
  async start(){
    if(this.running)return true;
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Kamera tidak didukung (butuh HTTPS/localhost).');
      if(!window.Hands)await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');
      this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
      this.video.srcObject=this.stream;await this.video.play();
      if(!this.hands){
        this.hands=new window.Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
        this.hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
        this.hands.onResults(r=>this.res(r));
      }
      this.running=true;this.loop();return true;
    }catch(e){console.warn('Kamera:',e);this.err=e;this.stop();return false;}
  },
  stop(){this.running=false;this.mode='off';if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}},
  loop(){
    if(!this.running)return;const v=this.video,now=performance.now();
    if(v.readyState>=2&&!this.busy&&now-this.last>40){
      this.busy=true;this.last=now;
      Promise.resolve(this.hands.send({image:v})).catch(()=>{}).then(()=>{this.busy=false;});
    }
    requestAnimationFrame(()=>this.loop());
  },
  beginVerify(cb,onProg){this.mode='verify';this.ok=0;this.prev=null;this.cb=cb;this.onProg=onProg;},
  res(r){
    if(this.mode==='off')return;const now=performance.now();
    const L=(r.multiHandLandmarks||[]).map(l=>{const s=dist(l[0],l[9]);return{c:palmCenter(l),s,open:isOpenPalm(l,s)};});
    if(this.mode==='verify'){
      const cand=L.filter(h=>h.open&&h.s>0.045).sort((a,b)=>b.s-a.s);
      if(cand.length){const h=cand[0];if(this.prev&&dist(this.prev,h.c)>0.2)this.ok=0;this.prev=h.c;this.ok++;}
      else{this.ok=Math.max(0,this.ok-2);this.prev=null;}
      if(this.onProg)this.onProg(Math.min(1,this.ok/this.need));
      if(this.ok>=this.need){ // kunci satu tangan
        const h=cand[0];this.lock={c:h.c,s:h.s};this.mode='track';this.lastSeen=now;this.tx=1-h.c.x;this.ty=h.c.y;
        const cb=this.cb;this.cb=null;if(cb)cb();
      }
      return;
    }
    if(this.mode==='track'){ // hanya ikuti tangan yang terkunci
      let best=null,bd=9;
      for(const h of L){const d=dist(h.c,this.lock.c),ra=h.s/this.lock.s;if(d<0.35&&ra>0.55&&ra<1.8&&d<bd){bd=d;best=h;}}
      if(best){
        this.lock.c={x:this.lock.c.x*.4+best.c.x*.6,y:this.lock.c.y*.4+best.c.y*.6};
        this.lock.s=this.lock.s*.8+best.s*.2;this.lastSeen=now;
        this.tx=this.tx*.45+(1-best.c.x)*.55;this.ty=this.ty*.45+best.c.y*.55;
      }
    }
  }
};

/* ================= PILIH SOAL ================= */
function pickQuestions(mode){
  const N=CFG.QN;
  const plan=mode==='mudah'?{m:N}:mode==='sedang'?{s:N}:{m:5,s:7,h:N-12};
  let used=new Set(lsGet('pp_used_v1',[]));const out=[];
  for(const lv in plan){
    const pool=QB.filter(q=>q.lv===lv);let fresh=pool.filter(q=>!used.has(q.id));
    if(fresh.length<plan[lv]){pool.forEach(q=>used.delete(q.id));fresh=pool;}
    shuffle(fresh).slice(0,plan[lv]).forEach(q=>{used.add(q.id);out.push(q);});
  }
  lsSet('pp_used_v1',[...used]);
  const ord={m:0,s:1,h:2};out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
  return out.map(q=>({lv:q.lv,tp:q.tp,q:q.q,e:q.e,
    opts:shuffle([{t:q.a,c:true},...q.w.map(t=>({t,c:false}))])}));
}

function heart(on,hurt){return `<svg viewBox="0 0 32 30" class="${hurt?'hurt':''}"><path d="M16 29C6 21 1 15 1 9a8 8 0 0 1 15-3.5A8 8 0 0 1 31 9c0 6-5 12-15 20z" fill="${on?'#ff2d2d':'#7b8aa8'}" stroke="#fff" stroke-width="2.5"/><ellipse cx="9" cy="8" rx="3" ry="2" fill="#fff" opacity="${on?.65:.25}"/></svg>`;}
function updateHUD(hurtIdx){
  const p=G.players[G.pi];let h='';
  for(let i=0;i<CFG.LIVES;i++)h+=heart(i<p.lives,i===hurtIdx);

let bannerTO=0;
function banner(txt,cls,ms){

  if(ms)bannerTO=setTimeout(()=>{b.className='';},ms);

/* ================= KONTROL ================= */
const joyEl=$('#joy'),knob=$('#knob'),joyWrap=$('#joyWrap');
function joyMove(e){
  const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2*0.7;
  let dx=(e.clientX-cx),dy=(e.clientY-cy);const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}
  joy.x=dx/R;joy.y=dy/R;
  const sc=r.width/200;knob.style.transform=`translate(${dx/sc}px,${dy/sc}px)`;
}
joyWrap.addEventListener('pointerdown',e=>{e.preventDefault();joy.on=true;joy.id=e.pointerId;try{joyWrap.setPointerCapture(e.pointerId);}catch(_){}joyMove(e);});
joyWrap.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){e.preventDefault();joyMove(e);}});
const joyUp=e=>{if(e.pointerId===joy.id){joy.on=false;joy.x=joy.y=0;knob.style.transform='';}};
joyWrap.addEventListener('pointerup',joyUp);joyWrap.addEventListener('pointercancel',joyUp);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'){if(curScr==='setup')showScreen('menu');else if(curScr==='game')togglePause();}if(curScr==='game'&&e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function getInput(){
  let x=joy.x,y=joy.y,act=joy.on&&Math.hypot(x,y)>.08;
  const kx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
  const ky=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  if(kx||ky){const m=Math.hypot(kx,ky);x=kx/m;y=ky/m;act=true;}
  return{x,y,act};
}
$('#btnMute').addEventListener('click',()=>{AU.mute=!AU.mute;$('#btnMute').textContent=AU.mute?'🔇':'🔊';if(!AU.mute)AU.click();});
$('#btnPause').addEventListener('click',()=>{AU.click();togglePause();});

/* ================= ALUR SOAL ================= */
function startQuestion(){
  const q=G.qs[G.qi],lv=CFG.LV[q.lv];G.q=q;G.lv=lv;G.timer=lv.time;G.timerMax=lv.time;
  G.phase='wave';G.obs=[];G.boxes=null;G.waveLeft=lv.obs;G.nextSp=.7;G.clearT=0;G.state='play';
  $('#expl').classList.remove('on');hideBanner();
  $('#qNo').textContent='Soal : '+(G.qi+1)+' / '+CFG.QN;setQ(q.q);updateTime();
}
function updateTime(){
  const t=Math.max(0,Math.ceil(G.timer));$('#tSec').textContent=t;$('#hudTime').classList.toggle('warn',G.timer<=5&&G.state==='play');
}
function spawnObstacle(lv){
  const types=['bird','bird','balloon','storm','drone','kite'];
  const type=types[Math.random()*types.length|0];
  const R={bird:30,balloon:42,storm:46,drone:34,kite:36}[type];
  const y=rand(CFG.PY0+10,CFG.PY1-10);
  G.obs.push({type,x:W+80,y,y0:y,r:R,sp:lv.obsSpeed*rand(.92,1.08),ph:rand(0,6.28),hit:false});
}
function spawnBoxes(lv){
  const q=G.q;
  G.boxes={x:W+20,speed:lv.boxSpeed,items:q.opts.map((o,i)=>({t:o.t,c:o.c,y:CFG.BOX_TOP+i*(CFG.BOX_H+CFG.BOX_GAP),st:0})),chosen:-1,reveal:false};
  G.phase='boxes';AU.tone(700,.18,'triangle',.1);AU.tone(900,.18,'triangle',.1,.12);
}
function answer(idx,timeout){
  const p=G.players[G.pi],b=G.boxes;let ok=false;
  if(idx>=0){b.chosen=idx;ok=b.items[idx].c;}
  b.reveal=true;p.answered++;
  const ci=b.items.findIndex(i=>i.c);
  if(ok){
    p.combo++;const bonus=10+Math.floor(G.timer)+Math.min(p.combo-1,5);p.score+=bonus;p.ok++;
    b.items[idx].st=1;AU.good();burst(plane.x+60,plane.y,'star',26);
    banner('Benar! +'+bonus,'good',1500);
    G.fbMsg='Benar! '+G.q.e;
  }else{
    p.combo=0;p.lives--;
    if(idx>=0)b.items[idx].st=2;b.items[ci].st=1;AU.bad();shake=1;
    banner(timeout?'Waktu Habis!':'Kurang Tepat','bad',1500);
    G.fbMsg='Jawaban benar: '+b.items[ci].t+'. '+G.q.e;
  }
  updateHUD(ok?undefined:p.lives); // hati yang padam diberi animasi
  const ex=$('#expl');ex.textContent=G.fbMsg;ex.classList.add('on');
  G.state='feedback';G.fbT=p.lives<=0?1.8:(ok?2.4:3.2);G.lastOk=ok;
}
function afterFeedback(){
  const p=G.players[G.pi];$('#expl').classList.remove('on');hideBanner();
  if(p.lives<=0){startCrash();return;}
  G.qi++;
  if(G.qi>=CFG.QN){finishRun();return;}
  startQuestion();
}
function finishRun(){
  G.state='finish';G.fT=2.2;AU.fan();banner('Selesai! \uD83C\uDF89','good',2000);
  for(let i=0;i<4;i++)setTimeout(()=>burst(rand(300,1000),rand(250,500),'star',20),i*250);
}
function startCrash(){
  const p=G.players[G.pi];p.crashed=true;G.state='crash';G.cT=0;AU.stopMusic();
  plane.vx=140;plane.vy=-110;plane.rot=0;banner('','',1);
}
function endTurn(){
  AU.stopMusic();hideBanner();$('#expl').classList.remove('on');
  if(G.pi+1<G.players.length){G.pi++;CAM.mode='off';showTrans();}
  else showResult();
}

/* ================= HASIL ================= */
function showResult(){

    html.push('<p>'+(pct>=.85?'Luar biasa! Kamu pilot pernapasan terbaik!':pct>=.6?'Hebat! Terus belajar ya!':'Ayo coba lagi, kamu pasti bisa!')+'</p>');
  }else{
    const rk=G.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||b.ok-a.ok||b.lives-a.lives);

      html.push('<tr class="'+(rank===0?'r1':'')+'"><td>'+(med[rank]||rank+1)+'</td><td>'+p.name.replace(/</g,'&lt;')+(p.crashed?' \uD83D\uDD25':'')+'</td><td><b>'+p.score+'</b></td><td>'+p.ok+'/'+CFG.QN+'</td><td>'+p.lives+'</td></tr>');});
    html.push('</table>');
  }
  html.push('<button class="bigbtn" id="btnAgain">Main Lagi \u21BB</button><button class="bigbtn alt" id="btnHome">Menu Utama</button>');

/* ================= PARTIKEL ================= */
function burst(x,y,type,n){
  for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(80,360);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.6,1.2),max:1.2,r:rand(5,12),type,col:['#ffd21f','#ff7a00','#6dff6d','#5ab4ff','#ff5a9d'][i%5],rot:rand(0,6),vr:rand(-6,6)});}
}
function puff(x,y,type){parts.push({x,y,vx:rand(-60,-20),vy:rand(-25,25),life:rand(.4,.8),max:.8,r:rand(6,12),type,col:'#fff',rot:0,vr:0});}
function updateParts(dt){
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.type==='star'||p.type==='fire')p.vy+=(p.type==='fire'?-120:420)*dt;if(p.type==='smoke')p.r+=14*dt;}
  parts=parts.filter(p=>p.life>0);if(parts.length>400)parts.splice(0,parts.length-400);
}

/* ================= UPDATE ================= */
function update(dt){
  if(!G)return;
  if(G.state!=='pause'&&G.state!=='camlost')bgT+=dt;
  shake=Math.max(0,shake-dt*2.5);
  const st=G.state;
  if(st==='pause'||st==='camlost')return;
  updateParts(dt);
  plane.prop+=dt*40;if(plane.inv>0)plane.inv-=dt;
  if(st==='crash'){updateCrash(dt);return;}

  /* pergerakan pesawat */
  if(st!=='idle'){
    const inp=getInput();let dvx=inp.x*CFG.PLANE_SPEED,dvy=inp.y*CFG.PLANE_SPEED;
    if(!inp.act&&G.ctrl==='cam'&&CAM.mode==='track'){
      const tx=CFG.PX0+clamp((CAM.tx-.1)/.8,0,1)*(CFG.PX1-CFG.PX0),ty=CFG.PY0+clamp((CAM.ty-.1)/.8,0,1)*(CFG.PY1-CFG.PY0);
      const dx=tx-plane.x,dy=ty-plane.y,d=Math.hypot(dx,dy);
      if(d>8){const sp=Math.min(d*7,CFG.PLANE_SPEED*1.25);dvx=dx/d*sp;dvy=dy/d*sp;}else{dvx=dvy=0;}
    }
    const k=Math.min(1,dt*10);plane.vx+=(dvx-plane.vx)*k;plane.vy+=(dvy-plane.vy)*k;
    plane.x=clamp(plane.x+plane.vx*dt,CFG.PX0,CFG.PX1);plane.y=clamp(plane.y+plane.vy*dt,CFG.PY0,CFG.PY1);
    plane.tilt+=((plane.vy/CFG.PLANE_SPEED)*.35-plane.tilt)*Math.min(1,dt*8);
    if(Math.random()<dt*28)puff(plane.x-95,plane.y+rand(-4,8),'smoke');
  }
  /* kamera hilang? */
  if(G.ctrl==='cam'&&(st==='play'||st==='feedback')&&CAM.mode==='track'&&performance.now()-CAM.lastSeen>1500){
    G.prev=st;G.state='camlost';AU.stopMusic();
    showOverlay('<h2>Tangan tidak terdeteksi</h2><p>Angkat telapak tanganmu \u270B lagi untuk melanjutkan</p><div class="pbar"><i id="ovbar"></i></div><button class="bigbtn alt sm" id="ovTouch">Pakai kontrol sentuh</button>');
    $('#ovTouch').onclick=()=>{AU.click();G.ctrl='touch';CAM.stop();$('#camMini').classList.remove('on');hideOverlay();G.state=G.prev;AU.startMusic();};
    CAM.beginVerify(()=>{hideOverlay();G.state=G.prev;AU.startMusic();},p=>{const b=$('#ovbar');if(b)b.style.width=(p*100)+'%';});
    return;
  }
  $('#camDot').classList.toggle('ok',G.ctrl==='cam'&&performance.now()-CAM.lastSeen<500);

  if(st==='countdown'){
    G.cd-=dt;const n=Math.ceil(G.cd-.4);
    if(G.cd>.4){if(n!==G.lastCd){G.lastCd=n;banner(String(n),'',0);AU.tick();}}
    else if(G.cd>-.3){if(G.lastCd!==0){G.lastCd=0;banner('Terbang!','good',700);AU.go();}}
    else{startQuestion();}
    return;
  }
  if(st==='finish'){plane.x+=Math.max(0,(plane.x>1100?600:0))*dt;G.fT-=dt;if(G.fT<=0)endTurn();return;}

  const lv=G.lv;
  /* rintangan bergerak */
  for(const o of G.obs){o.x-=o.sp*dt;o.ph+=dt*3;o.y=o.y0+Math.sin(o.ph)*(o.type==='balloon'||o.type==='kite'?18:o.type==='bird'?10:6);}
  G.obs=G.obs.filter(o=>o.x>-120);
  /* tabrakan */
  if(st==='play'||st==='feedback'){
    for(const o of G.obs){
      if(o.hit)continue;
      if(Math.hypot(o.x-(plane.x+8),o.y-plane.y)<o.r*.82+36&&plane.inv<=0){
        o.hit=true;plane.inv=1.3;plane.vx=-260;shake=.8;AU.hit();burst(plane.x+30,plane.y,'star',10);
        const p=G.players[G.pi];p.score=Math.max(0,p.score-5);
        if(CFG.OBSTACLE_COSTS_LIFE&&st==='play'){p.lives--;updateHUD(p.lives);if(p.lives<=0){G.q&&(G.boxes=G.boxes||{items:[],chosen:-1});startCrash();return;}}
        else updateHUD();
      }
    }
  }
  if(st==='play'){
    G.timer-=dt;updateTime();
    if(G.timer<=5&&Math.ceil(G.timer)!==G.lastTick&&G.timer>0){G.lastTick=Math.ceil(G.timer);AU.tick();}
    if(G.phase==='wave'){
      G.nextSp-=dt;
      if(G.waveLeft>0&&G.nextSp<=0){spawnObstacle(lv);G.waveLeft--;G.nextSp=rand(lv.gap[0],lv.gap[1]);}
      if(G.waveLeft<=0&&G.obs.every(o=>o.x<plane.x-90)){G.clearT+=dt;if(G.clearT>.5)spawnBoxes(lv);}
    }
    if(G.boxes){
      const b=G.boxes;b.speed=b.x<430?40:lv.boxSpeed;b.x-=b.speed*dt;
      if(!b.reveal&&b.x<1180)b.shown=true;
      const hx=plane.x+42;
      if(hx>b.x&&hx<b.x+CFG.BOX_W){
        for(let i=0;i<b.items.length;i++){const t=b.items[i].y;if(plane.y>=t-3&&plane.y<=t+CFG.BOX_H+3){answer(i,false);break;}}
      }
    }
    if(G.state==='play'&&G.timer<=0){G.timer=0;updateTime();if(!G.boxes)G.boxes={x:W,speed:0,items:G.q.opts.map((o,i)=>({t:o.t,c:o.c,y:CFG.BOX_TOP+i*(CFG.BOX_H+CFG.BOX_GAP),st:0})),chosen:-1,reveal:true,shown:true};answer(-1,true);}
  }else if(st==='feedback'){
    if(G.boxes){const b=G.boxes;b.x-=(b.x<430?40:60)*dt;}
    G.fbT-=dt;if(G.fbT<=0)afterFeedback();
  }
}
function updateCrash(dt){
  G.cT+=dt;plane.vy+=700*dt;plane.x+=plane.vx*dt;plane.y+=plane.vy*dt;plane.rot+=dt*(2.5+G.cT*2);plane.tilt=plane.rot;
  for(let i=0;i<3;i++){parts.push({x:plane.x+rand(-30,30),y:plane.y+rand(-15,15),vx:rand(-80,-20),vy:rand(-70,20),life:rand(.4,.9),max:.9,r:rand(8,18),type:'fire',col:'#ff9a1a',rot:0,vr:0});}
  if(Math.random()<.7)parts.push({x:plane.x,y:plane.y,vx:rand(-60,-10),vy:rand(-90,-20),life:rand(.8,1.4),max:1.4,r:rand(10,18),type:'smoke',col:'#333',rot:0,vr:0});
  if(!G.boomed&&plane.y>H+60){G.boomed=true;AU.boom();shake=1.4;for(let i=0;i<40;i++)parts.push({x:plane.x,y:H-20,vx:rand(-300,300),vy:rand(-500,-100),life:rand(.6,1.4),max:1.4,r:rand(8,20),type:'fire',col:'#ff7a00',rot:0,vr:0});}
  if(G.cT>.1&&!G.crashBanner){G.crashBanner=true;}
  if(G.cT>2.6&&!G.crashTxt){G.crashTxt=true;banner('Kesempatan Habis!','bad',2000);}
  if(G.cT>4.6){G.boomed=false;G.crashBanner=false;G.crashTxt=false;endTurn();}
}

/* ================= GAMBAR / RENDER ================= */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function lcg(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function buildCloud(w,h,seed){
  const c=mk(w,h),g=c.getContext('2d'),r=lcg(seed),n=5+seed%3,P=[];
  for(let i=0;i<n;i++){const t=i/(n-1);P.push([w*.16+w*.68*t,h*.58-Math.sin(t*Math.PI)*h*.2,h*(.2+Math.sin(t*Math.PI)*.2+r()*.06)]);}
  g.fillStyle='#bfe0f8';P.forEach(p=>{g.beginPath();g.arc(p[0],p[1]+h*.07,p[2],0,7);g.fill();});
  g.beginPath();g.ellipse(w/2,h*.7,w*.36,h*.14,0,0,7);g.fill();
  g.fillStyle='#fff';P.forEach(p=>{g.beginPath();g.arc(p[0],p[1],p[2],0,7);g.fill();});
  g.beginPath();g.ellipse(w/2,h*.64,w*.36,h*.14,0,0,7);g.fill();
  return c;
}
const CLOUDS=[buildCloud(360,190,1),buildCloud(300,160,2),buildCloud(420,210,3),buildCloud(260,140,4)];
const TILE=1600;
const FAR=(()=>{const c=mk(TILE,720),g=c.getContext('2d');
  g.fillStyle='rgba(125,172,218,.55)';g.beginPath();g.moveTo(0,590);
  for(let x=0;x<=TILE;x+=16){const t=x/TILE*Math.PI*2;g.lineTo(x,470-48*Math.sin(t*2+.5)-30*Math.sin(t*5+1.2)-14*Math.sin(t*9));}
  g.lineTo(TILE,590);g.fill();
  g.fillStyle='rgba(150,196,232,.6)';g.beginPath();g.moveTo(0,590);
  for(let x=0;x<=TILE;x+=16){const t=x/TILE*Math.PI*2;g.lineTo(x,510-30*Math.sin(t*3+2)-20*Math.sin(t*7));}
  g.lineTo(TILE,590);g.fill();return c;})();
const ISL=(()=>{const c=mk(TILE,720),g=c.getContext('2d'),r=lcg(7);
  const isl=[[140,200,90],[560,260,110],[1010,170,80],[1330,230,100]];
  isl.forEach(([cx,w,h],k)=>{
    const by=585;
    const rg=g.createLinearGradient(0,by-h*.3,0,by+30);rg.addColorStop(0,'#9b8466');rg.addColorStop(1,'#6e5b45');
    g.fillStyle=rg;g.beginPath();g.moveTo(cx-w*.5,by-h*.28);g.quadraticCurveTo(cx,by-h*.2,cx+w*.5,by-h*.28);g.lineTo(cx+w*.34,by+24);g.lineTo(cx-w*.34,by+24);g.fill();
    const gg=g.createLinearGradient(0,by-h,0,by-h*.2);gg.addColorStop(0,'#78d65a');gg.addColorStop(1,'#3fa83a');
    g.fillStyle=gg;g.beginPath();g.moveTo(cx-w*.55,by-h*.25);g.bezierCurveTo(cx-w*.4,by-h*1.0,cx+w*.4,by-h*1.0,cx+w*.55,by-h*.25);g.quadraticCurveTo(cx,by-h*.12,cx-w*.55,by-h*.25);g.fill();
    for(let i=0;i<4;i++){const tx=cx-w*.3+i*w*.2+r()*10,ty=by-h*(.62+r()*.15);
      g.fillStyle='#7a4e2a';g.fillRect(tx-3,ty,6,16);g.fillStyle='#2e9a3a';g.beginPath();g.arc(tx,ty-4,15+r()*5,0,7);g.fill();g.fillStyle='#4cbf4f';g.beginPath();g.arc(tx-4,ty-9,9,0,7);g.fill();}
    if(k%2===0){const hx=cx+w*.08,hy=by-h*.58;g.fillStyle='#fff3d6';g.fillRect(hx-14,hy,28,18);g.fillStyle='#e8503a';g.beginPath();g.moveTo(hx-19,hy);g.lineTo(hx,hy-16);g.lineTo(hx+19,hy);g.fill();g.fillStyle='#7a4e2a';g.fillRect(hx-4,hy+6,8,12);}
  });return c;})();

function drawBG(){
  const sg=ctx.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#3f9fe8');sg.addColorStop(.5,'#8fd3f7');sg.addColorStop(1,'#d9f2ff');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(1050,90,10,1050,90,380);rg.addColorStop(0,'rgba(255,255,255,.55)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  const fo=-(bgT*10)%TILE;ctx.drawImage(FAR,fo,0);ctx.drawImage(FAR,fo+TILE,0);
  /* awan belakang */
  for(const c of BGC){const x=((c.x-bgT*c.sp)%(W+500)+(W+500))%(W+500)-250;ctx.globalAlpha=c.a;ctx.drawImage(CLOUDS[c.k],x,c.y,CLOUDS[c.k].width*c.s,CLOUDS[c.k].height*c.s);}
  ctx.globalAlpha=1;
  const io=-(bgT*38)%TILE;ctx.drawImage(ISL,io,0);ctx.drawImage(ISL,io+TILE,0);
  const wg=ctx.createLinearGradient(0,575,0,H);wg.addColorStop(0,'#58d2e6');wg.addColorStop(1,'#2a9ad4');ctx.fillStyle=wg;ctx.fillRect(0,575,W,H-575);
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;ctx.lineCap='round';
  for(let i=0;i<16;i++){const x=((i*173-bgT*60)%(W+200)+(W+200))%(W+200)-100,y=590+(i*47)%120;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+40+(i%3)*15,y);ctx.stroke();}
  /* awan depan (di bawah) */
  for(const c of FGC){const x=((c.x-bgT*c.sp)%(W+600)+(W+600))%(W+600)-300;ctx.globalAlpha=.95;ctx.drawImage(CLOUDS[c.k],x,c.y,CLOUDS[c.k].width*c.s,CLOUDS[c.k].height*c.s);}
  ctx.globalAlpha=1;
  /* garis angin */
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
  for(let i=0;i<9;i++){const sp=520+i*30,x=((i*211-bgT*sp)%(W+300)+(W+300))%(W+300)-150,y=(i*89+40)%560+130;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+70+i*6,y);ctx.stroke();}
}
const BGC=[],FGC=[];
(function(){const r=lcg(11);for(let i=0;i<8;i++)BGC.push({x:r()*(W+500),y:40+r()*380,s:.45+r()*.4,k:i%4,sp:16+r()*18,a:.8});
  for(let i=0;i<6;i++)FGC.push({x:r()*(W+600),y:600+r()*70,s:.9+r()*.7,k:i%3,sp:70+r()*30});})();

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function drawPlane(g,x,y,tilt,pt,alpha){
  g.save();g.translate(x,y);g.rotate(tilt);g.globalAlpha=alpha;
  const body=()=>{g.beginPath();g.moveTo(-102,0);g.quadraticCurveTo(-96,-30,-30,-33);g.lineTo(40,-33);g.quadraticCurveTo(88,-30,98,0);g.quadraticCurveTo(88,31,40,33);g.lineTo(-30,33);g.quadraticCurveTo(-96,29,-102,0);g.closePath();};
  /* sirip ekor */
  g.fillStyle='#e8322e';g.beginPath();g.moveTo(-72,-10);g.lineTo(-110,-56);g.quadraticCurveTo(-96,-60,-84,-57);g.lineTo(-50,-18);g.closePath();g.fill();
  g.fillStyle='#c92521';g.beginPath();g.ellipse(-86,6,24,8,-.08,0,7);g.fill();
  /* badan */
  const bg=g.createLinearGradient(0,-33,0,33);bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#cddcf2');g.fillStyle=bg;body();g.fill();
  g.save();body();g.clip();g.fillStyle='#e8322e';g.fillRect(-110,12,240,30);g.fillRect(64,-40,60,80);
  g.fillStyle='#fff';g.fillRect(-110,8,170,4);g.restore();
  g.strokeStyle='#a9bad4';g.lineWidth=2;body();g.stroke();
  /* jendela */
  [-58,-32,-6].forEach(wx=>{g.fillStyle='#fff';g.beginPath();g.ellipse(wx,-6,10,12,0,0,7);g.fill();g.fillStyle='#4aa8ee';g.beginPath();g.ellipse(wx,-6,7,9,0,0,7);g.fill();});
  /* sayap */
  g.fillStyle='#e8322e';g.beginPath();g.moveTo(-28,14);g.lineTo(34,14);g.lineTo(12,50);g.quadraticCurveTo(-8,56,-30,48);g.closePath();g.fill();
  g.fillStyle='#fff';g.fillRect(-20,22,40,4);
  /* roda */
  g.strokeStyle='#555';g.lineWidth=5;g.beginPath();g.moveTo(24,32);g.lineTo(28,50);g.stroke();
  g.fillStyle='#2b2b33';g.beginPath();g.arc(28,54,9,0,7);g.fill();g.fillStyle='#bbb';g.beginPath();g.arc(28,54,3.5,0,7);g.fill();
  /* anak di kokpit */
  g.fillStyle='#3f6fc9';rr(g,26,-30,30,18,6);g.fill();
  g.fillStyle='#ffd2b0';g.beginPath();g.arc(41,-40,15,0,7);g.fill();
  g.fillStyle='#5b3b22';g.beginPath();g.arc(41,-44,16,Math.PI*1.02,Math.PI*2.05);g.fill();g.beginPath();g.ellipse(33,-46,10,8,-.4,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(36,-39,3.6,0,7);g.arc(47,-39,3.6,0,7);g.fill();
  g.fillStyle='#3a2414';g.beginPath();g.arc(37,-39,2.2,0,7);g.arc(48,-39,2.2,0,7);g.fill();
  g.strokeStyle='#b5503a';g.lineWidth=2;g.beginPath();g.arc(42,-34,5,.15,Math.PI-.15);g.stroke();
  /* kanopi */
  g.fillStyle='rgba(170,224,255,.5)';g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=3;
  g.beginPath();g.moveTo(14,-30);g.quadraticCurveTo(18,-64,46,-62);g.quadraticCurveTo(70,-58,72,-30);g.closePath();g.fill();g.stroke();
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(30,-52,6,3,-.6,0,7);g.fill();
  /* baling-baling */
  g.fillStyle='#d12a27';g.beginPath();g.arc(100,0,9,0,7);g.fill();
  g.save();g.translate(103,0);g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(0,0,7,42,0,0,7);g.fill();
  g.rotate(pt);g.fillStyle='rgba(50,50,70,.8)';g.beginPath();g.ellipse(0,-22,5,22,0,0,7);g.ellipse(0,22,5,22,0,0,7);g.fill();g.restore();
  g.restore();
}

function drawObs(g,o){
  g.save();g.translate(o.x,o.y);
  if(o.type==='bird'){
    const f=Math.sin(o.ph*3.3);g.fillStyle='#37506b';g.beginPath();g.ellipse(0,0,28,14,0,0,7);g.fill();
    g.beginPath();g.arc(-26,-5,11,0,7);g.fill();
    g.fillStyle='#f5a623';g.beginPath();g.moveTo(-35,-6);g.lineTo(-50,0);g.lineTo(-35,0);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(-29,-8,3.6,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-30,-8,1.8,0,7);g.fill();
    g.fillStyle='#2a3d54';g.beginPath();g.moveTo(-8,-6);g.lineTo(14,-6);g.lineTo(30,-6-38*f);g.closePath();g.fill();
    g.beginPath();g.moveTo(24,-2);g.lineTo(44,-8);g.lineTo(44,6);g.closePath();g.fill();
  }else if(o.type==='balloon'){
    g.save();g.beginPath();g.ellipse(0,-14,38,46,0,0,7);g.clip();
    ['#ff4b4b','#ffd21f','#3fb7ff','#ffd21f','#ff4b4b'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(-38+i*15.2,-70,15.2,100);});g.restore();
    g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.ellipse(0,-14,38,46,0,0,7);g.stroke();
    g.strokeStyle='#7a4e2a';g.lineWidth=2;g.beginPath();g.moveTo(-18,28);g.lineTo(-10,46);g.moveTo(18,28);g.lineTo(10,46);g.stroke();
    g.fillStyle='#a8703a';g.fillRect(-12,46,24,16);
  }else if(o.type==='storm'){
    g.fillStyle='#5f6f82';[[-28,4,22],[0,-8,28],[28,4,22],[0,10,26]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],p[2],0,7);g.fill();});
    g.fillStyle='#7d8da1';g.beginPath();g.arc(-6,-14,14,0,7);g.fill();
    if(Math.sin(o.ph*4)>-.3){g.fillStyle='#ffe44d';g.beginPath();g.moveTo(-4,14);g.lineTo(12,14);g.lineTo(2,32);g.lineTo(14,32);g.lineTo(-10,58);g.lineTo(-4,38);g.lineTo(-14,38);g.closePath();g.fill();}
  }else if(o.type==='drone'){
    g.strokeStyle='#37474f';g.lineWidth=5;g.beginPath();g.moveTo(-30,-12);g.lineTo(30,12);g.moveTo(30,-12);g.lineTo(-30,12);g.stroke();
    g.fillStyle='#546e7a';rr(g,-20,-11,40,22,8);g.fill();g.fillStyle='#ff4040';g.beginPath();g.arc(0,0,5,0,7);g.fill();
    [[-32,-14],[32,-14],[-32,14],[32,14]].forEach(p=>{g.fillStyle='rgba(200,220,235,.7)';g.beginPath();g.ellipse(p[0],p[1],20*Math.abs(Math.cos(o.ph*14))+4,4,0,0,7);g.fill();});
  }else{ /* layang-layang */
    g.rotate(Math.sin(o.ph)*.2);
    g.fillStyle='#ff5a9d';g.beginPath();g.moveTo(0,-38);g.lineTo(26,0);g.lineTo(0,30);g.lineTo(-26,0);g.closePath();g.fill();
    g.fillStyle='#ffd21f';g.beginPath();g.moveTo(0,-38);g.lineTo(26,0);g.lineTo(0,0);g.closePath();g.fill();g.fillStyle='#3fb7ff';g.beginPath();g.moveTo(0,30);g.lineTo(-26,0);g.lineTo(0,0);g.closePath();g.fill();
    g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(0,-38);g.lineTo(0,30);g.moveTo(-26,0);g.lineTo(26,0);g.stroke();
    g.strokeStyle='#e8503a';g.lineWidth=3;g.beginPath();g.moveTo(0,30);for(let i=1;i<=5;i++)g.lineTo((i%2?9:-9),30+i*10);g.stroke();
  }
  g.restore();
}

function fitText(g,text,maxW,maxLines,maxFs,minFs){
  for(let fs=maxFs;fs>=minFs;fs--){
    g.font='800 '+fs+"px 'Baloo 2','Trebuchet MS',sans-serif";
    const words=text.split(' '),lines=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
    lines.push(cur);
    if(lines.length<=maxLines||fs===minFs)return{fs,lines};
  }
}
function drawBoxes(g){
  const b=G.boxes;if(!b)return;
  let near=-1;
  if(G.state==='play'&&b.x<W){near=b.items.findIndex(it=>plane.y>=it.y-3&&plane.y<=it.y+CFG.BOX_H+3);}
  b.items.forEach((it,i)=>{
    const x=b.x,y=it.y,w=CFG.BOX_W,h=CFG.BOX_H;if(x>W+10)return;
    const shown=b.reveal||x<1150;
    let fill=['#f9fcff','#d9e9ff'],bd='#1f6fe0';
    if(it.st===1){fill=['#eaffea','#bff0bf'];bd='#1fa83a';}else if(it.st===2){fill=['#fff0f0','#ffc9c9'];bd='#e03a3a';}
    if(i===near&&it.st===0){g.shadowColor='#ffe14d';g.shadowBlur=26;}
    rr(g,x,y,w,h,26);g.fillStyle=bd;g.fill();g.shadowBlur=0;
    const gg=g.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,fill[0]);gg.addColorStop(1,fill[1]);
    rr(g,x+7,y+7,w-14,h-14,20);g.fillStyle=gg;g.fill();
    g.textAlign='center';g.textBaseline='middle';
    if(!shown){g.fillStyle='#12388f';g.font="800 58px 'Baloo 2',sans-serif";g.fillText('?',x+w/2,y+h/2+4);}
    else{
      g.fillStyle='#ff9d0a';g.beginPath();g.arc(x+36,y+h/2,19,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
      g.fillStyle='#fff';g.font="800 24px 'Baloo 2',sans-serif";g.fillText('ABCDE'[i],x+36,y+h/2+2);
      const ft=fitText(g,it.t,w-104,2,25,14);g.font='800 '+ft.fs+"px 'Baloo 2','Trebuchet MS',sans-serif";g.fillStyle='#12388f';
      const lh=ft.fs*1.08,sy=y+h/2-((ft.lines.length-1)*lh)/2+2;ft.lines.forEach((ln,k)=>g.fillText(ln,x+w/2+22,sy+k*lh));
    }
  });
}
function drawParts(g){
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);g.globalAlpha=a;
    if(p.type==='star'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.beginPath();for(let i=0;i<10;i++){const r=i%2?p.r*.45:p.r*1.1,an=i*Math.PI/5;g.lineTo(Math.sin(an)*r,-Math.cos(an)*r);}g.closePath();g.fill();g.restore();}
    else if(p.type==='fire'){g.fillStyle=a>.5?'#ffd23a':p.col;g.beginPath();g.arc(p.x,p.y,p.r*a+2,0,7);g.fill();}
    else{g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();}
  }
  g.globalAlpha=1;
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-1,1)*shake*9,rand(-1,1)*shake*9);
  drawBG();
  if(G){
    for(const o of G.obs)drawObs(ctx,o);
    drawBoxes(ctx);
    if(!(G.state==='crash'&&plane.y>H+80)){
      const a=plane.inv>0?(Math.floor(plane.inv*12)%2?.35:1):1;
      drawPlane(ctx,plane.x,plane.y,plane.tilt,plane.prop,a);
    }
    drawParts(ctx);
  }
  ctx.restore();
}

/* ================= LOOP ================= */
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  if(curScr==='game'){update(dt);render();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});

/* debug kecil untuk pengujian */
window.__PP={QB,CFG,pickQuestions};
})();
</script>
